{{- $isEntraID := has .Values.oauth2Proxy.mode (list "entra-id") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  {{- if $isEntraID }}
  annotations:
    azure.workload.identity/client-id: {{ required "clientId is required for Workload Identity" .Values.clientId | quote }}
  {{- end }}
  labels:
    {{- if $isEntraID }}
    azure.workload.identity/use: "true"
    {{- end }}
    {{- include "cetirun-istio.labels" . | nindent 4 }}
