{{- if .Values.tls.enabled }}
{{- $cert := required "tls.cert is required when tls.enabled is true" .Values.tls.cert -}}
{{- $key := required "tls.key is required when tls.enabled is true" .Values.tls.key -}}
apiVersion: v1
kind: Secret
metadata:
  name: cetirun-tls
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "cetirun-istio.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert | b64enc | quote }}
  tls.key: {{ $key | b64enc | quote }}
{{- end }}
