{{/*
Cookie secret handling:
- If user provides .Values.cookieSecret (32-char string), use it.
- Otherwise, try to reuse the existing secret from a previous deployment.
- Generate a new 32-character alphanumeric secret only on first install.
- Fail on upgrade if there is no key to reuse.

Note: We use randAlphaNum (not randBytes) to generate printable ASCII characters,
      avoiding UTF-8 encoding issues. The 32-char string becomes the AES key for
      OAuth2 Proxy sessions.

Migration: cookieSecretLegacyNamespace defaults to istio-system. An empty
           namespace disables that fallback, not the current-namespace lookup.
*/}}
{{- $settings := include "cetirun-istio.ingressSettings" . | fromJson -}}
{{- $cookieSecret := "" -}}
{{- if .Values.cookieSecret -}}
  {{/* User-provided secret: base64-encode for Secret data field */}}
  {{- $cookieSecret = .Values.cookieSecret | b64enc -}}
{{- else -}}
  {{/* Try to lookup existing secret in current namespace */}}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "oauth2-proxy-credentials" -}}
  {{- if $existingSecret -}}
    {{/* Reuse existing secret value (already base64-encoded) */}}
    {{- $cookieSecret = required "existing oauth2-proxy-credentials Secret is missing cookie-secret; restore it before upgrading" (get ($existingSecret.data | default dict) "cookie-secret") -}}
  {{- else -}}
    {{- if and $settings.cookieSecretLegacyNamespace (ne $settings.cookieSecretLegacyNamespace .Release.Namespace) -}}
      {{- $legacySecret := lookup "v1" "Secret" $settings.cookieSecretLegacyNamespace "oauth2-proxy-credentials" -}}
      {{- if $legacySecret -}}
        {{- $cookieSecret = required "legacy oauth2-proxy-credentials Secret is missing cookie-secret; restore it before migration" (get ($legacySecret.data | default dict) "cookie-secret") -}}
      {{- end -}}
    {{- end -}}
    {{- if not $cookieSecret -}}
      {{- if .Release.IsUpgrade -}}
        {{- fail "oauth2-proxy-credentials Secret was not found during upgrade; restore it or explicitly supply cookieSecret instead of generating a new session key" -}}
      {{- end -}}
      {{/* Generate 32-char alphanumeric string, base64-encode for Secret data field */}}
      {{- $cookieSecret = randAlphaNum 32 | b64enc -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-istio.labels" . | nindent 4 }}
type: Opaque
data:
  cookie-secret: {{ $cookieSecret }}
