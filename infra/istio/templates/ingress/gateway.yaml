{{- $settings := include "cetirun-istio.ingressSettings" . | fromJson -}}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: cetirun-gateway
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "cetirun-istio.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: cetirun-tls
      hosts:
        - "{{ .Values.domain }}"
        {{- if $settings.includeWildcardHost }}
        - "*.{{ .Values.domain }}"
        {{- end }}
