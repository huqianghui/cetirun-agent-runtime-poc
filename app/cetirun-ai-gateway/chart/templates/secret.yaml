{{/*
  Platform credentials for the Gateway.

  Every generated value is read back from the live Secret on upgrade rather than
  regenerated. That matters most for the salt key: LiteLLM encrypts stored
  provider credentials with it and offers no rotation path, so a chart that
  produced a fresh value on each upgrade would silently make every model stored
  in the database unreadable. The proxy would keep reporting healthy while doing
  it.

  The Secret is also kept on `helm uninstall`. The database outlives the
  release, so without this an uninstall followed by an install produced a new
  salt key against the old database: every model added through the console
  vanished from the model list, the previous master key stopped working, and
  nothing but a log warning said why. With it kept, the reinstall's lookup finds
  the old values and reuses them.

  Only keys the administrator has not supplied through their own Secret are
  written here.
*/}}
{{- $secretName := include "cetirun-ai-gateway.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $needsMasterKey := not .Values.auth.masterKey.existingSecret -}}
{{- $needsSaltKey := not .Values.auth.saltKey.existingSecret -}}
{{- $needsUIPassword := and .Values.auth.adminUI.enabled (not .Values.auth.adminUI.passwordSecret.existingSecret) -}}
{{- if or $needsMasterKey $needsSaltKey $needsUIPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cetirun-ai-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $needsMasterKey }}
  {{- /* Admin API key for LiteLLM's management API, with the sk- prefix of
         LiteLLM's other keys. v1.101.0 was measured accepting a supplied key
         without the prefix, so nothing depends on it. */}}
  {{- $masterKey := "" }}
  {{- if and $existing $existing.data (index $existing.data "master-key") }}
  {{- $masterKey = (index $existing.data "master-key" | b64dec) }}
  {{- else }}
  {{- $masterKey = printf "sk-%s" (randAlphaNum 48) }}
  {{- end }}
  master-key: {{ $masterKey | b64enc | quote }}
{{- end }}
{{- if $needsSaltKey }}
  {{- /* Encrypts provider credentials at rest in the database. Never
         regenerated: the branch below reads the existing value back so an
         upgrade cannot change it. */}}
  {{- $saltKey := "" }}
  {{- if and $existing $existing.data (index $existing.data "salt-key") }}
  {{- $saltKey = (index $existing.data "salt-key" | b64dec) }}
  {{- else }}
  {{- $saltKey = printf "sk-%s" (randAlphaNum 48) }}
  {{- end }}
  salt-key: {{ $saltKey | b64enc | quote }}
{{- end }}
{{- if $needsUIPassword }}
  {{- /* Console sign-in. Generated rather than left unset, because LiteLLM
         accepts the master key as the UI password when none is configured,
         which turns a console login into full management API access. */}}
  {{- $uiPassword := "" }}
  {{- if and $existing $existing.data (index $existing.data "ui-password") }}
  {{- $uiPassword = (index $existing.data "ui-password" | b64dec) }}
  {{- else }}
  {{- $uiPassword = randAlphaNum 32 }}
  {{- end }}
  ui-password: {{ $uiPassword | b64enc | quote }}
{{- end }}
{{- end }}
