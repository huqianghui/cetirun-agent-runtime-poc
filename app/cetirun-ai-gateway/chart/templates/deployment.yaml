{{- $metricsEnabled := (include "cetirun-ai-gateway.logsAndMetrics" . | fromJson).metrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cetirun-ai-gateway.fullname" . }}
  labels:
    {{- include "cetirun-ai-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cetirun-ai-gateway.gatewaySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Roll the pods when the generated configuration changes. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.providerCredentials.inline (not .Values.providerCredentials.existingSecret) }}
        {{- /* Credentials reach the proxy as environment variables, read once at
        startup. Without this, changing an inline value updated the Secret while
        every pod went on sending the old key. */}}
        checksum/providers: {{ include (print $.Template.BasePath "/secret-providers.yaml") . | sha256sum }}
        {{- end }}
        {{- if $metricsEnabled }}
        {{- /* The ADX-Mon collector of the cetirun-observability chart scrapes
        the metrics port of Pods with these annotations. */}}
        adx-mon/scrape: "true"
        adx-mon/port: {{ include "cetirun-ai-gateway.metricsPort" . | quote }}
        adx-mon/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cetirun-ai-gateway.gatewaySelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cetirun-ai-gateway.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- /* The proxy uses 90% of this period to finish requests; the rest is
      reserved for shutdown cleanup before Kubernetes sends SIGKILL. */}}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.migrations.enabled }}
      {{- /* Migrations run before the proxy starts, in every pod. prisma holds a
      PostgreSQL advisory lock while it migrates, so pods starting together wait
      for each other and the later ones find nothing left to apply. Unlike a
      pre-install hook, an init container can wait for a database that is still
      starting: the bundled PostgreSQL does not yet exist when such a hook runs.
      It gets the database connection and no other credential. */}}
      initContainers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "cetirun-ai-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
          env:
            {{- include "cetirun-ai-gateway.databaseEnv" . | nindent 12 }}
            {{- include "cetirun-ai-gateway.monitoringEnv" . | nindent 12 }}
            {{- if eq (include "cetirun-ai-gateway.priceTable" .) "bundled" }}
            {{- include "cetirun-ai-gateway.priceTableEnv" . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: gateway
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "cetirun-ai-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /* --config has no documented default; it is always passed. */}}
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - {{ .Values.service.port | quote }}
            {{- if $metricsEnabled }}
            {{- /* LiteLLM starts a second process that serves the metrics on
            this port, without authentication, and stops it with the proxy. */}}
            - --prometheus_metrics_port
            - {{ include "cetirun-ai-gateway.metricsPort" . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if $metricsEnabled }}
            - name: metrics
              containerPort: {{ include "cetirun-ai-gateway.metricsPort" . }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "cetirun-ai-gateway.proxyEnv" . | nindent 12 }}
          {{- if or .Values.providerCredentials.existingSecret .Values.providerCredentials.inline }}
          envFrom:
            - secretRef:
                name: {{ include "cetirun-ai-gateway.providerSecretName" . }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- /* The file, not the directory: Kubernetes updates a directory-mounted
            ConfigMap inside running pods, and LiteLLM re-reads its configuration
            file every 30 seconds while models are stored in the database, removing
            each configured model whose ID is no longer in the file without adding
            the new entry. During an upgrade that edits a model, the old pods then
            stopped serving it until they were replaced. Mounted with subPath, a
            pod keeps the configuration it started with, and checksum/config
            replaces the pods when the configuration changes. */}}
            - name: config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if $metricsEnabled }}
            - name: metrics
              mountPath: {{ include "cetirun-ai-gateway.metricsDirectory" . }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "cetirun-ai-gateway.configMapName" . }}
        {{- if $metricsEnabled }}
        {{- /* LiteLLM clears it when the proxy starts, so samples from a
        previous container never reappear. */}}
        - name: metrics
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
