{{/*
  Provider API keys, when supplied inline rather than through an existing
  Secret. Each key becomes an environment variable of the same name, which the
  model list references as `os.environ/NAME`.

  Inline values are for evaluation. They are visible to anyone who can read the
  release, so a real installation should use providerCredentials.existingSecret.
*/}}
{{- if and .Values.providerCredentials.inline (not .Values.providerCredentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cetirun-ai-gateway.providerSecretName" . }}
  labels:
    {{- include "cetirun-ai-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := .Values.providerCredentials.inline }}
  {{ $name }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
