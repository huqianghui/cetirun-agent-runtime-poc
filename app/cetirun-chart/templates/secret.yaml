{{- if and (ne (include "cetirun.agent.type" .) "custom") (not .Values.secrets.existingSecret) -}}
{{/*
  Use lookup function to preserve existing secrets on upgrade.
  This prevents regenerating tokens and API keys when the chart is upgraded.
*/}}
{{- $secretName := include "cetirun.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cetirun.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- /* BRAVE_API_KEY */}}
  {{- if .Values.secrets.braveApiKey }}
  BRAVE_API_KEY: {{ .Values.secrets.braveApiKey | b64enc | quote }}
  {{- else if and $existingSecret $existingSecret.data }}
  BRAVE_API_KEY: {{ index $existingSecret.data "BRAVE_API_KEY" | default "" | quote }}
  {{- else }}
  BRAVE_API_KEY: ""
  {{- end }}

  {{- /* PERPLEXITY_API_KEY */}}
  {{- if .Values.secrets.perplexityApiKey }}
  PERPLEXITY_API_KEY: {{ .Values.secrets.perplexityApiKey | b64enc | quote }}
  {{- else if and $existingSecret $existingSecret.data }}
  PERPLEXITY_API_KEY: {{ index $existingSecret.data "PERPLEXITY_API_KEY" | default "" | quote }}
  {{- else }}
  PERPLEXITY_API_KEY: ""
  {{- end }}

  {{- /* TAILSCALE_AUTH_KEY */}}
  {{- if .Values.secrets.tailscaleAuthKey }}
  TAILSCALE_AUTH_KEY: {{ .Values.secrets.tailscaleAuthKey | b64enc | quote }}
  {{- else if and $existingSecret $existingSecret.data }}
  TAILSCALE_AUTH_KEY: {{ index $existingSecret.data "TAILSCALE_AUTH_KEY" | default "" | quote }}
  {{- else }}
  TAILSCALE_AUTH_KEY: ""
  {{- end }}

  {{- /* OPENCLAW_GATEWAY_TOKEN - Required, but use placeholder for linting */}}
  {{- if .Values.secrets.openclawGatewayToken }}
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.secrets.openclawGatewayToken | b64enc | quote }}
  {{- else if and $existingSecret $existingSecret.data }}
  OPENCLAW_GATEWAY_TOKEN: {{ index $existingSecret.data "OPENCLAW_GATEWAY_TOKEN" | default "" | quote }}
  {{- else }}
  # Placeholder for initial deployment - should be replaced with actual value
  OPENCLAW_GATEWAY_TOKEN: {{ "change-me" | b64enc | quote }}
  {{- end }}

  {{- /* CETIRUN_AUTH_KEY — bearer key for the in-pod cetirun-auth helper service.
       Auto-generated and preserved across upgrades. Used by the Portal "Copilot
       Auth" UI to talk to the in-pod /v1/* endpoints. */}}
  {{- $cetirunAuthKey := "" }}
  {{- if and $existingSecret $existingSecret.data (index $existingSecret.data "CETIRUN_AUTH_KEY") }}
  {{- $cetirunAuthKey = (index $existingSecret.data "CETIRUN_AUTH_KEY" | b64dec) }}
  {{- else }}
  {{- $cetirunAuthKey = randAlphaNum 48 }}
  {{- end }}
  CETIRUN_AUTH_KEY: {{ $cetirunAuthKey | b64enc | quote }}

  {{- include "cetirun.agent.secretData" . }}
{{- end }}
