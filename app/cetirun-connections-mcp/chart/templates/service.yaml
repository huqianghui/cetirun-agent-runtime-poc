apiVersion: v1
kind: Service
metadata:
  name: {{ include "cetirun-connections-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-connections-mcp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cetirun-connections-mcp.selectorLabels" . | nindent 4 }}
    {{- if .Values.nativeSandbox.enabled }}
    sandbox.cetirun.microsoft.com/peer-uid: {{ required "nativeSandbox.peerUID is required" .Values.nativeSandbox.peerUID | quote }}
    {{- end }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
