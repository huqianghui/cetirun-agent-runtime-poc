apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cetirun-portal.fullname" . }}
  labels:
    {{- include "cetirun-portal.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["agents"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["teams"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["agentpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- if (.Values.sandboxStorage).platformConfigMapName }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  {{- end }}
  # The AI Gateway's shared-model catalog the operator publishes: model names
  # and limits only.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cetirun-ai-gateway-catalog"]
    verbs: ["get"]
  {{- if ((.Values.skillMarketplace).enabled) }}
  # The Skill Marketplace catalog: skill names, descriptions and versions,
  # and each Team's publication state.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cetirun-skill-marketplace"]
    verbs: ["get"]
  {{- end }}
