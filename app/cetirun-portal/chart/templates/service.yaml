apiVersion: v1
kind: Service
metadata:
  name: {{ include "cetirun-portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-portal.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 8081
      targetPort: http-internal
      protocol: TCP
      name: http-internal
  selector:
    {{- include "cetirun-portal.selectorLabels" . | nindent 4 }}
