{{- $admission := .Values.sandboxAdmission -}}
{{- if $admission.enforce -}}
{{- if not (semverCompare ">=1.37.0-0" .Capabilities.KubeVersion.Version) -}}
{{- fail "sandboxAdmission.enforce requires Kubernetes >= 1.37 (validated admission minimum)" -}}
{{- end -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $admission.timeoutSeconds))) (lt (int64 $admission.timeoutSeconds) 1) (gt (int64 $admission.timeoutSeconds) 30) -}}
{{- fail "sandboxAdmission.timeoutSeconds must be an integer between 1 and 30 when enforce=true" -}}
{{- end -}}
{{- $encodedCA := required "sandboxAdmission.caBundle is required when enforce=true" $admission.caBundle -}}
{{- $encodedCA = regexReplaceAll "[\\r\\n]" $encodedCA "" -}}
{{- $decodedCA := b64dec $encodedCA -}}
{{- if ne (b64enc $decodedCA) $encodedCA -}}
{{- fail "sandboxAdmission.caBundle must be a base64-encoded PEM certificate bundle" -}}
{{- end -}}
{{- $certificatePattern := "-----BEGIN CERTIFICATE-----\\r?\\n(?:[A-Za-z0-9+/=]+\\r?\\n)+-----END CERTIFICATE-----" -}}
{{- $certificates := regexFindAll $certificatePattern $decodedCA -1 -}}
{{- if or (empty $certificates) (ne (trim (regexReplaceAll $certificatePattern $decodedCA "")) "") -}}
{{- fail "sandboxAdmission.caBundle must be a base64-encoded PEM certificate bundle" -}}
{{- end -}}
{{- range $certificate := $certificates -}}
{{- $body := regexReplaceAll "-----BEGIN CERTIFICATE-----|-----END CERTIFICATE-----|[[:space:]]" $certificate "" -}}
{{- if or (empty $body) (ne (b64enc (b64dec $body)) $body) -}}
{{- fail "sandboxAdmission.caBundle contains invalid PEM certificate encoding" -}}
{{- end -}}
{{- end -}}
{{- $controllerUsername := printf "system:serviceaccount:%s:%s" .Values.namespace .Values.serviceAccount.name -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: cetirun-sandbox-admission
  labels:
    app.kubernetes.io/name: cetirun-sandbox-admission
    app.kubernetes.io/managed-by: {{ .Release.Service }}
webhooks:
  - name: sandbox-configuration.cetirun.microsoft.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: {{ int64 $admission.timeoutSeconds }}
    matchPolicy: Equivalent
    clientConfig:
      caBundle: {{ $encodedCA | quote }}
      service:
        name: cetirun-sandbox-admission
        namespace: {{ .Values.namespace | quote }}
        path: /validate-sandbox-configuration
        port: 443
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["cetirun.microsoft.com"]
        apiVersions: ["v1alpha1"]
        resources: ["agents", "teams", "sandboxes", "agentpolicies"]
        scope: Cluster
      - operations: ["DELETE"]
        apiGroups: ["cetirun.microsoft.com"]
        apiVersions: ["v1alpha1"]
        resources: ["teams", "sandboxes", "agentpolicies"]
        scope: Cluster
    matchConditions:
      {{- include "cetirun-operator.sandboxCleanupMatch" $controllerUsername | nindent 6 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: cetirun-sandbox-admission
  labels:
    app.kubernetes.io/name: cetirun-sandbox-admission
    app.kubernetes.io/managed-by: {{ .Release.Service }}
webhooks:
  - name: sandbox-agent.cetirun.microsoft.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    reinvocationPolicy: Never
    failurePolicy: Fail
    timeoutSeconds: {{ int64 $admission.timeoutSeconds }}
    matchPolicy: Equivalent
    clientConfig:
      caBundle: {{ $encodedCA | quote }}
      service:
        name: cetirun-sandbox-admission
        namespace: {{ .Values.namespace | quote }}
        path: /mutate-sandbox-agent
        port: 443
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["cetirun.microsoft.com"]
        apiVersions: ["v1alpha1"]
        resources: ["agents"]
        scope: Cluster
    matchConditions:
      {{- include "cetirun-operator.sandboxCleanupMatch" $controllerUsername | nindent 6 }}
      {{- if include "cetirun-operator.cetiadminAdmission" . }}
      - name: exclude-cetiadmin-caller
        expression: {{ printf "request.userInfo.username != %s" (include "cetirun-operator.cetiadminUsername" . | toJson) | quote }}
      {{- end }}
{{- end }}
