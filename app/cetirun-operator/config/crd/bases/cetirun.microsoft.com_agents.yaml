---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: agents.cetirun.microsoft.com
spec:
  group: cetirun.microsoft.com
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - cra
    singular: agent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.user.alias
      name: Alias
      type: string
    - jsonPath: .spec.agent.type
      name: Agent
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.accessUrl
      name: AccessURL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is a cluster-scoped, long-lived agent environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec defines the desired state of Agent.
            properties:
              agent:
                description: Agent is the required per-instance Agent configuration.
                properties:
                  image:
                    description: |-
                      Image is an OCI image reference. Required for custom agents; built-in
                      defaults are resolved and pinned by the runtime, not by the API schema.
                    maxLength: 2048
                    minLength: 1
                    type: string
                  port:
                    description: |-
                      Port is the native HTTP port for built-ins. For Custom it serves the
                      Chat HTTP contract unless WebUI is true. Omit it for a headless Custom.
                      Built-ins resolve their version-specific default outside the schema.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  registrySecretRef:
                    description: |-
                      RegistrySecretRef names a Portal-managed source Secret in the platform
                      credential namespace, not the Pod's imagePullSecret. Runtime code must
                      verify Agent UID ownership before creating a local pull Secret.
                    properties:
                      name:
                        description: |-
                          Name is a Secret name in the platform-configured credential namespace.
                          A syntactically valid reference does not grant access to that Secret.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  type:
                    default: hermes
                    description: Type selects the integration. Defaults to Hermes
                      and cannot change.
                    enum:
                    - openclaw
                    - hermes
                    - custom
                    type: string
                  username:
                    default: vibe
                    description: |-
                      Username identifies an existing non-root image user with HOME at
                      /home/<username>. The image must declare the corresponding numeric USER.
                      Kubernetes does not create or switch users by this name.
                    maxLength: 32
                    minLength: 1
                    pattern: ^[a-z_][a-z0-9_-]{0,31}$
                    type: string
                    x-kubernetes-validations:
                    - message: agent username must not be root
                      rule: self != 'root'
                  webUI:
                    default: false
                    description: |-
                      WebUI declares that Port serves a browser application instead of Chat.
                      Custom-only; the platform publishes it at /ui/<instance>/ with authentication.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - fieldPath: .image
                  message: custom agents require image
                  rule: self.type != 'custom' || has(self.image)
                - fieldPath: .type
                  message: agent type is immutable
                  rule: self.type == oldSelf.type
                - fieldPath: .username
                  message: agent username is immutable
                  rule: self.username == oldSelf.username
                - fieldPath: .image
                  message: a pinned image cannot be removed
                  rule: '!has(oldSelf.image) || has(self.image)'
                - fieldPath: .webUI
                  message: webUI is supported only for custom agents
                  rule: '!self.webUI || self.type == ''custom'''
                - fieldPath: .port
                  message: webUI requires port
                  rule: '!self.webUI || has(self.port)'
              agentIdentity:
                description: |-
                  AgentIdentity enables the Microsoft Entra Agent Identity integration for
                  this instance. Identity identifiers and owner claims are platform-managed
                  and are deliberately not accepted in spec.
                properties:
                  enabled:
                    description: Enabled requests a dedicated Agent Identity for this
                      instance.
                    type: boolean
                type: object
              gatewayTokenSecretRef:
                description: |-
                  GatewayTokenSecretRef names the built-in Agent's multi-purpose Secret
                  in the instance namespace. Required for openclaw/hermes and forbidden for
                  custom; it is not the model-access or registry credential.
                maxLength: 253
                minLength: 1
                type: string
              helm:
                description: Helm chart configuration overrides.
                properties:
                  maintenance:
                    description: |-
                      Maintenance requests a Helm handoff while the Agent is suspended.
                      The controller and admission verify the handoff before native writes.
                    properties:
                      expectedRevision:
                        description: ExpectedRevision is the positive Helm revision
                          observed before the request.
                        format: int64
                        minimum: 1
                        type: integer
                      requestID:
                        description: RequestID correlates this request with the controller's
                          handoff status.
                        maxLength: 128
                        minLength: 16
                        pattern: ^[A-Za-z0-9_-]+$
                        type: string
                    required:
                    - expectedRevision
                    - requestID
                    type: object
                    x-kubernetes-validations:
                    - fieldPath: .expectedRevision
                      message: a Helm maintenance request ID cannot change its expected
                        revision
                      rule: self.requestID != oldSelf.requestID || self.expectedRevision
                        == oldSelf.expectedRevision
                  values:
                    additionalProperties:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    description: Values contains arbitrary Helm values merged on top
                      of operator defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  version:
                    description: |-
                      Version pins the OpenClaw Helm chart version for this instance.
                      When empty on first reconcile, the operator backfills it with
                      its own --chart-version default so that future operator upgrades
                      do not automatically roll out a new chart version (which would
                      restart the StatefulSet pod and interrupt the user's session).
                      Note: the initial backfill bumps the CR generation, which triggers
                      a single Helm upgrade call. Because the backfilled version matches
                      the chart already installed, this upgrade is a no-op and does not
                      restart the StatefulSet pod.
                      To upgrade an instance, update this field to the desired version.
                    type: string
                type: object
              model:
                description: |-
                  Model is the Agent's preferred default model as exposed by the platform
                  AI Gateway, such as a shared model or a GitHub Copilot model;
                  copilot/<model> names a Copilot model by its ID. Policy resolution rejects
                  an explicitly requested model that is outside the effective policy.
                maxLength: 256
                type: string
              modelAccess:
                description: |-
                  ModelAccess requests model sources when the platform AI Gateway is
                  enabled. Policy-bound Agents must explicitly request each source.
                  Legacy Agents retain default-on sources unless explicitly disabled.
                properties:
                  githubCopilot:
                    description: |-
                      GitHubCopilot requests a GitHub Copilot proxy for the owner's account.
                      The effective policy must also allow it.
                    type: boolean
                  monthlyBudgetUSD:
                    description: |-
                      MonthlyBudgetUSD optionally lowers or raises this Agent's native Gateway
                      budget within the effective AgentPolicy maximum. Omission selects the
                      policy default.
                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
                    type: string
                  sharedModels:
                    description: |-
                      SharedModels requests the models administrators share through the AI
                      Gateway.
                    type: boolean
                type: object
              plannedMigration:
                description: |-
                  PlannedMigration requests a healthy-source cold move of a reconciled
                  OpenClaw/Hermes Agent. It does not authorize force deletion or failover.
                properties:
                  requestID:
                    description: Reusing the current ID only observes that request.
                    maxLength: 128
                    minLength: 16
                    pattern: ^[A-Za-z0-9_-]+$
                    type: string
                  target:
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      uid:
                        description: |-
                          UID is a type that holds unique ID values, including UUIDs.  Because we
                          don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                          intent and helps make sure that UIDs and names do not get conflated.
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                required:
                - requestID
                - target
                type: object
              restartRequestID:
                description: |-
                  RestartRequestID requests a retained restart through normal reconciliation.
                  Reusing the current ID does not request another restart. The Agent and HOME
                  identities are retained; suspension and deletion take precedence.
                maxLength: 128
                minLength: 16
                pattern: ^[A-Za-z0-9_-]+$
                type: string
              sandboxRef:
                description: |-
                  SandboxRef opts into Sandbox execution and selects a Sandbox permitted
                  by the Team. Legacy Agents omit it and use the existing runtime path.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              skillOverrides:
                description: |-
                  SkillOverrides customizes the set of skills installed for this instance.
                  Add appends skills on top of the team defaults; Remove excludes
                  specific team skills from this instance.
                properties:
                  add:
                    description: |-
                      Add lists skills to install in addition to team defaults.
                      Each entry is a ClawHub package ID (e.g. "@anthropic/mcp-server-fetch")
                      or an npm package prefixed with "npm:" (e.g. "npm:@openclaw/matrix").
                    items:
                      pattern: ^(npm:)?(@[a-z0-9][\w.-]*\/)?[a-z0-9][\w.-]*(@[\w.+-]+)?$
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: set
                  remove:
                    description: |-
                      Remove lists team-default skills to exclude from this instance.
                      Uses the same format as Add. Entries not present in the team skill
                      list are silently ignored.
                    items:
                      pattern: ^(npm:)?(@[a-z0-9][\w.-]*\/)?[a-z0-9][\w.-]*(@[\w.+-]+)?$
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: set
                type: object
              suspended:
                description: |-
                  Suspended, when true, scales the instance to zero replicas and removes
                  ingress routing. The instance data (PVC) is preserved. Set this field
                  to restrict access for a user without deleting their instance.
                  Default: false.
                type: boolean
              tailscale:
                description: |-
                  Tailscale configures the Tailscale mesh VPN sidecar for this instance.
                  When set, the operator reads the auth key from the referenced Secret
                  and passes it to the OpenClaw Helm chart. Other Tailscale settings
                  (hostname and serve) use chart defaults and can be
                  overridden via spec.helm.values if needed.
                properties:
                  authKeySecretRef:
                    description: |-
                      AuthKeySecretRef is the name of a Secret in the instance namespace (cetirun-<alias>)
                      containing a Tailscale auth key under the data key "TAILSCALE_AUTH_KEY".
                      Setting this enables Tailscale (no separate toggle).
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                    type: string
                required:
                - authKeySecretRef
                type: object
              team:
                description: |-
                  Team is the name of the Team this instance belongs to.
                  The operator merges team defaults (user context, AI model, skills) into
                  the instance configuration. Per-instance fields take precedence.
                type: string
              user:
                description: User information for this instance.
                properties:
                  alias:
                    description: |-
                      Alias is the user's short name, used for the namespace, hostname, and Helm release.
                      Must be a lowercase alphanumeric string optionally separated by hyphens.
                    pattern: ^[a-z][a-z0-9-]{0,62}$
                    type: string
                  displayName:
                    description: DisplayName is the human-readable name shown in the
                      UI.
                    type: string
                  email:
                    description: Email address for notifications (optional).
                    type: string
                  team:
                    description: |-
                      Team is legacy display context, not a Team or policy assignment.
                      Deprecated: use spec.team for Team configuration.
                    type: string
                required:
                - alias
                - displayName
                type: object
            required:
            - agent
            - user
            type: object
            x-kubernetes-validations:
            - fieldPath: .gatewayTokenSecretRef
              message: gatewayTokenSecretRef is required for built-in agents and forbidden
                for custom agents
              rule: 'self.agent.type == ''custom'' ? !has(self.gatewayTokenSecretRef)
                : has(self.gatewayTokenSecretRef)'
            - fieldPath: .restartRequestID
              message: restartRequestID cannot be removed once set
              rule: '!has(oldSelf.restartRequestID) || has(self.restartRequestID)'
            - fieldPath: .restartRequestID
              message: a suspended Agent cannot request a new restart
              rule: '!(has(self.suspended) && self.suspended) || !has(self.restartRequestID)
                || (has(oldSelf.restartRequestID) && self.restartRequestID == oldSelf.restartRequestID)'
            - fieldPath: .plannedMigration
              message: a migration request ID cannot select a different destination
              rule: '!has(self.plannedMigration) || !has(oldSelf.plannedMigration)
                || self.plannedMigration.requestID != oldSelf.plannedMigration.requestID
                || self.plannedMigration == oldSelf.plannedMigration'
            - fieldPath: .helm.maintenance
              message: a Helm maintenance request requires suspension
              rule: '!has(self.helm) || !has(self.helm.maintenance) || (has(self.suspended)
                && self.suspended)'
            - fieldPath: .suspended
              message: clearing Helm maintenance must retain suspension; resume is
                a separate update
              rule: '!has(oldSelf.helm) || !has(oldSelf.helm.maintenance) || (has(self.helm)
                && has(self.helm.maintenance)) || (has(self.suspended) && self.suspended)'
          status:
            description: AgentStatus defines the observed state of Agent.
            properties:
              accessUrl:
                description: |-
                  AccessURL is the HTTPS endpoint for the instance's native agent UI.
                  Example: "https://cetirun.example.com/ui/alice/"
                type: string
              agentIdentity:
                description: |-
                  AgentIdentity reports the platform-managed Entra identity lifecycle.
                  It never contains user tokens, authorization caches, or credentials.
                properties:
                  clientId:
                    description: ClientID is the public application identifier of
                      the Agent Identity.
                    type: string
                  creationAttempted:
                    description: |-
                      CreationAttempted records a durable create checkpoint, which prevents a
                      retry after an unknown request outcome from creating a second identity.
                    type: boolean
                  credentialPolicyRevision:
                    description: |-
                      CredentialPolicyRevision identifies a current, owned Broker enforcement
                      record read back independently of its application. It binds the policy,
                      owner and canonical Agent Identity; token issuance is not applied evidence.
                    type: string
                  displayName:
                    description: |-
                      DisplayName is the immutable directory display name bound to this Agent
                      Identity. It remains stable if the deployment name prefix changes.
                    type: string
                  lastVerifiedTime:
                    description: LastVerifiedTime records the most recent canonical
                      directory verification.
                    format: date-time
                    type: string
                  objectId:
                    description: |-
                      ObjectID is the directory object identifier used for deterministic cleanup.
                      It is platform-managed and is not a credential.
                    type: string
                  observedGeneration:
                    description: ObservedGeneration is the Agent generation reconciled
                      into this status.
                    format: int64
                    type: integer
                  phase:
                    description: Phase is the current Agent Identity lifecycle phase.
                    enum:
                    - Disabled
                    - Provisioning
                    - Ready
                    - Degraded
                    - Failed
                    - Deleting
                    type: string
                  reason:
                    description: Reason is a stable, non-sensitive machine-readable
                      status reason.
                    type: string
                type: object
              aiGateway:
                description: |-
                  AIGateway reports the Agent's AI Gateway virtual key. It never contains
                  the key itself.
                properties:
                  accessGroups:
                    description: AccessGroups are the Gateway model access groups
                      granted to the key.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  blocked:
                    description: |-
                      Blocked reports whether the Gateway rejects this key. Retained blocked
                      keys continue to report spend and reset evidence.
                    type: boolean
                  budgetDuration:
                    description: BudgetDuration is the Gateway reset period, currently
                      "1mo".
                    type: string
                  budgetResetAt:
                    description: BudgetResetAt is the next Gateway budget reset observation.
                    format: date-time
                    type: string
                  budgetUSD:
                    description: |-
                      BudgetUSD is the canonical native Gateway budget read back for this
                      virtual key. It is a management observation, not a provider invoice.
                    type: string
                  copilot:
                    description: |-
                      Copilot reports the Agent's GitHub Copilot proxy and the Copilot models
                      registered for it in the Gateway.
                    properties:
                      accessGroup:
                        description: |-
                          AccessGroup is the Gateway access group of this Agent's Copilot models.
                          Only this Agent's key is granted it.
                        type: string
                      models:
                        description: |-
                          Models are the registered Copilot models, as the Agent names them: the
                          name of the shared model a Copilot model is the same model as, or the
                          Copilot model's own ID.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      notAllowed:
                        description: |-
                          NotAllowed lists the account's models left out because the Agent's
                          AgentPolicy does not allow them: each is the same model as a shared
                          model, and the policy lists none of the shared models that are that
                          model. The policy's shared models apply to the owner's Copilot models
                          too.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      phase:
                        description: |-
                          Phase is SignInRequired until the owner signs in to GitHub Copilot
                          through the Portal, Starting while the proxy picks up the sign-in,
                          Ready once the account's models are registered, and Degraded when
                          registration fails.
                        enum:
                        - SignInRequired
                        - Starting
                        - Ready
                        - Degraded
                        type: string
                      proxyKeyId:
                        description: |-
                          ProxyKeyID identifies the proxy's master key without revealing it: the
                          first characters of the key's SHA-256 hash. The proxy reads the key
                          when it starts, so a new key restarts it.
                        type: string
                      reason:
                        description: Reason is a stable, non-sensitive machine-readable
                          status reason.
                        type: string
                      registered:
                        description: Registered are the Gateway model IDs registered
                          for this Agent's proxy.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      routes:
                        description: Routes pairs each registered Copilot model with
                          its name in the Gateway.
                        items:
                          description: AIGatewayCopilotRoute is one of the Agent's
                            registered Copilot models.
                          properties:
                            model:
                              description: Model is the Copilot model's ID.
                              type: string
                            name:
                              description: Name is the model's name in the Gateway,
                                which the Agent uses.
                              type: string
                            shared:
                              description: |-
                                Shared reports that Name is a shared model's name: the Gateway serves
                                the Agent's requests for it from the shared model's deployments and
                                from this Copilot model.
                              type: boolean
                            vision:
                              description: |-
                                Vision reports that the model accepts images, as the Gateway's price
                                table says for the entry the route is billed as. The Agent is
                                configured to send images to Name only when every model behind Name
                                accepts them.
                              type: boolean
                          required:
                          - model
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      skipped:
                        description: |-
                          Skipped lists the account's models left out because a model the Gateway
                          serves already has their name and is another model.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      unpriced:
                        description: |-
                          Unpriced lists the account's models left out because the Gateway has no
                          price for them: an unpriced model would be refused or escape the budget.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  defaultModel:
                    description: DefaultModel is the model the Agent uses by default.
                    type: string
                  keyAlias:
                    description: |-
                      KeyAlias is the Gateway alias of the virtual key. It is derived from the
                      Agent UID and does not change for the life of the Agent.
                    type: string
                  keyId:
                    description: |-
                      KeyID identifies the current key value without revealing it: the first
                      characters of the key's SHA-256 hash, which is how the Gateway stores it.
                    type: string
                  keySecretName:
                    description: |-
                      KeySecretName names the Secret in the instance namespace that holds the
                      virtual key.
                    type: string
                  lastVerifiedTime:
                    description: |-
                      LastVerifiedTime records the most recent successful check of the key in
                      the Gateway.
                    format: date-time
                    type: string
                  modelRouters:
                    description: |-
                      ModelRouters reports the Agent's smart-routing models: those of its
                      Team, then, with an AgentPolicy, the routers configured in the Gateway
                      that the policy lists; whether each is granted, and if not why.
                    items:
                      description: |-
                        AIGatewayModelRouterStatus reports one smart-routing model for the Agent, a
                        router of its Team or one configured in the Gateway: whether the Agent's key
                        was granted it, and if not why. A router is granted only when the Agent may
                        use every model it sends requests to.
                      properties:
                        alias:
                          description: |-
                            Alias is the router's name when the Agent's key also reaches a Team's
                            router under it, through a key alias the operator keeps for each
                            granted Team router. A Hermes Agent is configured with the router under
                            this name. Empty when another model the key reaches, such as one of the
                            Agent's GitHub Copilot models or an alias that an administrator set,
                            has the name; the Agent then uses the internal name.
                          type: string
                        contextWindow:
                          description: |-
                            ContextWindow and MaxTokens are the limits the Agent is configured with
                            for the router. They are the smallest known limits of the models that
                            the router sends requests to: its tier models and, for a router
                            configured in the Gateway, its default model. The Agent's own GitHub
                            Copilot routes under the names of these models count too. For a router
                            configured in the Gateway, limits that the router itself sets replace
                            those of its models.
                          format: int64
                          type: integer
                        granted:
                          description: Granted reports whether the Agent's key may
                            use the router.
                          type: boolean
                        maxTokens:
                          format: int64
                          type: integer
                        model:
                          description: |-
                            Model is the Gateway model name the Agent sends requests for the
                            router to: a Team router's internal name, or the name of a router
                            configured in the Gateway. Set only when the router is granted.
                          type: string
                        name:
                          description: Name is the router's name, the model name the
                            owner chooses.
                          type: string
                        reason:
                          description: Reason explains why the router is not granted.
                          type: string
                        vision:
                          description: |-
                            Vision reports that the Agent is configured to send images to the
                            router: every model that the router sends requests to answer accepts
                            them. The Agent's own GitHub Copilot routes under the names of these
                            models count too.
                          type: boolean
                      required:
                      - granted
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  models:
                    description: |-
                      Models are the model names the Agent is configured with, as the Agent
                      sees them in the Gateway.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  observedGeneration:
                    description: ObservedGeneration is the Agent generation reconciled
                      into this status.
                    format: int64
                    type: integer
                  phase:
                    description: Phase is the current virtual key lifecycle phase.
                    enum:
                    - Provisioning
                    - Ready
                    - Degraded
                    - Deleting
                    type: string
                  policyRevision:
                    description: |-
                      PolicyRevision is the exact Gateway policy projection read back by
                      the management adapter.
                    type: string
                  pricingRevision:
                    description: |-
                      PricingRevision identifies the catalog/pricing input used by Gateway
                      read-back. It is not a provider price quote.
                    type: string
                  reason:
                    description: Reason is a stable, non-sensitive machine-readable
                      status reason.
                    type: string
                  routed:
                    description: |-
                      Routed reports whether the Agent's model traffic is configured to use
                      the Gateway.
                    type: boolean
                  spendUSD:
                    description: |-
                      SpendUSD is the Gateway's observed spend in the current period. It is
                      not exact upstream-provider billing.
                    type: string
                  team:
                    description: Team is the Gateway team the key belongs to, derived
                      from spec.team.
                    type: string
                type: object
              conditions:
                description: Conditions contains the latest available observations
                  of the instance's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
