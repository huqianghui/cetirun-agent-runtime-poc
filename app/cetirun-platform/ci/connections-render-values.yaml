istio:
  enabled: true
cetirun-agent-broker:
  enabled: false
cetirun-connections-mcp:
  enabled: true
  tls:
    secretName: tools-server-tls
  broker:
    baseURL: https://cetirun-agent-broker.cetirun-credentials.svc.cluster.local
    clientTLSSecretName: tools-broker-client-tls
  portal:
    baseURL: https://portal.example.invalid
  istio:
    sidecarInjection: true
    revision: asm-example
    brokerNamespace: cetirun-credentials
    controlPlaneNamespace: aks-istio-system
cetirun-operator:
  namespace: cetirun-system
  domainSuffix: portal.example.invalid
  istioRevision: asm-example
  connectionsMCP:
    url: https://cetirun-connections-mcp.cetirun-system.svc.cluster.local/mcp
    audience: cetirun-connections-mcp
    caSecretName: connections-ca
  agentIdentity:
    brokerURL: http://cetirun-agent-broker.cetirun-credentials.svc.cluster.local:8080
cetirun-portal:
  istio:
    host: portal.example.invalid
  features:
    agentToolsEnabled: true
  agentIdentity:
    tenantId: 11111111-1111-1111-1111-111111111111
    portalClientId: 22222222-2222-2222-2222-222222222222
  agentTools:
    brokerURL: http://cetirun-agent-broker.cetirun-credentials.svc.cluster.local:8080
  aiGateway:
    catalogNamespace: cetirun-system
