apiVersion: v1
kind: Service
metadata:
  name: {{ include "cetirun-agent-broker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-agent-broker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cetirun-agent-broker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.tls.enabled }}
    - name: https
      port: 443
      targetPort: https
    {{- end }}
