apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cetirun-agent-broker.fullname" . }}
  labels:
    {{- include "cetirun-agent-broker.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["cetirun-agent-tools-broker"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["cetirun-sandbox-pods"]
    verbs: ["get"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["agents"]
    verbs: ["get", "list"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["teams", "agentpolicies"]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "serviceaccounts", "namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cetirun-agent-broker.fullname" . }}
  labels:
    {{- include "cetirun-agent-broker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cetirun-agent-broker.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cetirun-agent-broker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cetirun-agent-broker.fullname" . }}-records
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-agent-broker.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cetirun-agent-broker.fullname" . }}-records
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-agent-broker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cetirun-agent-broker.fullname" . }}-records
subjects:
  - kind: ServiceAccount
    name: {{ include "cetirun-agent-broker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
